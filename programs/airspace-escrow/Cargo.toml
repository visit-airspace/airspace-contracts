[package]
name = "airspace-escrow"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "AirSpace escrow program, a fork of the Solana Foundation escrow with an admin settled mode"

[lib]
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[features]
no-entrypoint = []
devnet = []

[dependencies]
const-crypto = { workspace = true }
pinocchio = { workspace = true, features = ["cpi"] }
