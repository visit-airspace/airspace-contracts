name: CI

# Builds both programs and the hook programs, then runs the unit and LiteSVM
# tests and the style checks from the README.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLANA_VERSION: v3.1.14

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
      - name: Cache the Solana tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}
      - name: Install the Solana tools
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build the programs
        run: |
          cargo build-sbf --version
          cargo build-sbf --manifest-path programs/airspace-escrow/Cargo.toml
          cargo build-sbf --manifest-path programs/airspace-deposit/Cargo.toml
      - name: Build the hook programs
        run: |
          cargo build-sbf --manifest-path tests/test-hook-program/Cargo.toml --features allow
          cp target/deploy/test_hook_program.so target/deploy/test_hook_allow.so
          cargo build-sbf --manifest-path tests/test-hook-program/Cargo.toml --features deny
          cp target/deploy/test_hook_program.so target/deploy/test_hook_deny.so
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --quiet
